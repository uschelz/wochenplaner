<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplaner</title>
<link rel="apple-touch-icon" href="./icon.png">

<style>
body {margin:0;font-family:-apple-system;background:#eaeaea;overflow:hidden;}

.header {
display:flex;
justify-content:space-between;
padding:10px;
background:white;
align-items:center;
}

/* BUCH */
.book {
position:relative;
height:calc(100vh - 80px);
perspective:2000px;
overflow:hidden;
}

.pageContainer {
display:flex;
height:100%;
position:absolute;
width:100%;
backface-visibility:hidden;
}

.page {
flex:1;
padding:8px;
background:white;
display:flex;
flex-direction:column;
gap:8px;
}

.left {flex:1.2;}
.right {flex:0.8;}

.spine {width:4px;background:#ccc;}

textarea {
flex:1;border:none;font-size:14px;
background-image:linear-gradient(to bottom,transparent 95%,#ddd 95%);
background-size:100% 24px;
}

.today {outline:2px solid red;}

/* BLÄTTERN */
.flipPage {
position:absolute;
width:50%;
height:100%;
top:0;
left:50%;
transform-origin:left;
background:white;
backface-visibility:hidden;
box-shadow:0 0 20px rgba(0,0,0,0.2);
display:none;
}

.flipBack {
position:absolute;
width:100%;
height:100%;
transform:rotateY(180deg);
background:white;
}

/* OVERLAY */
#calendarOverlay {
position:fixed;
top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;
z-index:1000;
}

button {font-size:16px;padding:6px 10px;}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<button onclick="changeWeek(-1)">←</button>
<div id="title"></div>
<button onclick="toggleCalendar()">📅</button>
<div>
<button onclick="goToday()">Heute</button>
<button onclick="changeWeek(1)">→</button>
</div>
</div>

<!-- BUCH -->
<div class="book" id="book">

<div class="pageContainer" id="current">
<div class="page left" id="left"></div>
<div class="spine"></div>
<div class="page right" id="right"></div>
</div>

<div class="flipPage" id="flip">
<div class="flipBack" id="flipBack"></div>
</div>

</div>

<!-- BACKUP -->
<div style="position:fixed;bottom:10px;width:100%;text-align:center;">
<button onclick="backup()">⚡ Backup</button>
<button onclick="loadBackup()">Laden</button>
</div>

<script>
let weekOffset=0;

// ===== RENDER =====
function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-day+(day===0?-6:1);
return new Date(d.setDate(diff));
}

function formatDate(d){return d.toLocaleDateString("de-DE");}

function createDay(name,date){
let div=document.createElement("div");

let header=document.createElement("div");
header.innerText=name+" ("+formatDate(date)+")";

let ta=document.createElement("textarea");
let key="plan_"+formatDate(date);
ta.value=localStorage.getItem(key)||"";
ta.oninput=()=>localStorage.setItem(key,ta.value);

div.appendChild(header);
div.appendChild(ta);
return div;
}

function render(offset){
let base=new Date();
base.setDate(base.getDate()+offset*7);

let monday=getMonday(base);
let sunday=new Date(monday);
sunday.setDate(monday.getDate()+6);

document.getElementById("title").innerText=
formatDate(monday)+" – "+formatDate(sunday);

let left=document.getElementById("left");
let right=document.getElementById("right");

left.innerHTML="";
right.innerHTML="";

["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i);
left.appendChild(createDay(d,date));
});

["Donnerstag","Freitag"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i+3);
right.appendChild(createDay(d,date));
});
}

// ===== BLÄTTERN =====
let startX=0;
let isDragging=false;

const flip=document.getElementById("flip");
const book=document.getElementById("book");

document.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
isDragging=true;
flip.style.display="block";
});

document.addEventListener("touchmove",e=>{
if(!isDragging)return;
let x=e.touches[0].clientX;
let diff=startX-x;

let angle=Math.min(Math.max(diff/2,0),180);
flip.style.transform="rotateY("+(-angle)+"deg)";
});

document.addEventListener("touchend",e=>{
if(!isDragging)return;
let x=e.changedTouches[0].clientX;
let diff=startX-x;

if(diff>80){
flip.style.transform="rotateY(-180deg)";
setTimeout(()=>{
weekOffset++;
render(weekOffset);
flip.style.display="none";
flip.style.transform="rotateY(0deg)";
},300);
}else{
flip.style.transform="rotateY(0deg)";
setTimeout(()=>flip.style.display="none",200);
}

isDragging=false;
});

// ===== BACKUP =====
function backup(){
let data=JSON.stringify(localStorage);
let blob=new Blob([data]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup.txt";
a.click();
}

function loadBackup(){
let input=document.createElement("input");
input.type="file";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=e=>{
let data=JSON.parse(e.target.result);
for(let k in data) localStorage.setItem(k,data[k]);
render(weekOffset);
};
reader.readAsText(e.target.files[0]);
};
input.click();
}

// START
render(weekOffset);
</script>

</body>
</html>
