<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplaner</title>

<style>
body {margin:0;font-family:-apple-system;background:#eaeaea;overflow:hidden;}
.header {display:flex;justify-content:space-between;padding:10px;background:white;align-items:center;}

.book {display:flex;height:calc(100vh - 80px);}
.page {flex:1;padding:8px;background:white;display:flex;flex-direction:column;gap:8px;}

.day {flex:1;display:flex;flex-direction:column;}

textarea {
flex:1;border:none;
background-image:linear-gradient(to bottom,transparent 95%,#ddd 95%);
background-size:100% 24px;
}

.today {outline:2px solid red;}
.holiday {background:#ffe0e0;}
.vacation {background:#e6ffe6;}

button {font-size:16px;padding:6px 10px;}

/* Mini-Kalender */
#calendarOverlay {
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;
}

#calendarBox {
background:white;margin:50px auto;padding:10px;
width:90%;max-width:350px;border-radius:10px;
}

#calendarGrid {
display:grid;grid-template-columns:repeat(7,1fr);
gap:4px;margin-top:10px;
}
</style>
</head>

<body>

<!-- MINI-KALENDER -->
<div id="calendarOverlay">
<div id="calendarBox">

<div style="display:flex;justify-content:space-between;">
<button onclick="changeMonth(-1)">←</button>
<div id="monthTitle"></div>
<button onclick="changeMonth(1)">→</button>
</div>

<div id="calendarGrid"></div>

<button onclick="toggleCalendar()" style="margin-top:10px;width:100%;">Schließen</button>
</div>
</div>

<div class="header">
<button onclick="changeWeek(-1)">←</button>
<div id="title"></div>
<button onclick="toggleCalendar()">📅</button>
<div>
<button onclick="goToday()">Heute</button>
<button onclick="changeWeek(1)">→</button>
</div>
</div>

<div class="book">
<div class="page" id="left"></div>
<div class="page" id="right"></div>
</div>

<div style="position:fixed;bottom:10px;width:100%;text-align:center;">
<button onclick="backup()">💾 Backup</button>
<button onclick="loadBackup()">Laden</button>
</div>

<script>
let weekOffset=0;
let calDate=new Date();

// ===== ISO DATE =====
function getISO(d){
return new Date(d.getFullYear(), d.getMonth(), d.getDate())
.toISOString().split("T")[0];
}

// ===== FEIERTAGE =====
function getEaster(year){
let f=Math.floor,G=year%19,C=f(year/100);
let H=(C-f(C/4)-f((8*C+13)/25)+19*G+15)%30;
let I=H-f(H/28)*(1-f(29/(H+1))*f((21-G)/11));
let J=(year+f(year/4)+I+2-C+f(C/4))%7;
let L=I-J;
let m=3+f((L+40)/44);
let d=L+28-31*f(m/4);
return new Date(year,m-1,d);
}

function getHolidays(year){
let easter=getEaster(year);
let h={};
const add=(d,n)=>h[getISO(d)]=n;

add(new Date(year,0,1),"Neujahr");
add(new Date(year,0,6),"Heilige Drei Könige");
add(new Date(year,4,1),"Tag der Arbeit");
add(new Date(year,9,3),"Tag der Deutschen Einheit");
add(new Date(year,10,1),"Allerheiligen");
add(new Date(year,11,25),"1. Weihnachtstag");
add(new Date(year,11,26),"2. Weihnachtstag");

let gf=new Date(easter); gf.setDate(easter.getDate()-2);
let em=new Date(easter); em.setDate(easter.getDate()+1);
let ch=new Date(easter); ch.setDate(easter.getDate()+39);
let pm=new Date(easter); pm.setDate(easter.getDate()+50);
let fr=new Date(easter); fr.setDate(easter.getDate()+60);

add(gf,"Karfreitag");
add(em,"Ostermontag");
add(ch,"Christi Himmelfahrt");
add(pm,"Pfingstmontag");
add(fr,"Fronleichnam");

return h;
}

// ===== FERIEN =====
const vacations=[
["2026-08-03","2026-09-14"],
["2027-08-02","2027-09-13"],
["2028-07-31","2028-09-11"]
];

function isVacation(date){
let iso=getISO(date);
return vacations.some(v=>iso>=v[0] && iso<=v[1]);
}

// ===== MINI-KALENDER =====
function toggleCalendar(){
let el=document.getElementById("calendarOverlay");
if(el.style.display==="block"){
el.style.display="none";
}else{
el.style.display="block";
calDate=new Date();
renderCalendar();
}
}

function changeMonth(n){
calDate.setMonth(calDate.getMonth()+n);
renderCalendar();
}

function renderCalendar(){
let grid=document.getElementById("calendarGrid");
grid.innerHTML="";

let holidays=getHolidays(calDate.getFullYear());

let first=new Date(calDate.getFullYear(),calDate.getMonth(),1);
let start=(first.getDay()+6)%7;
let days=new Date(calDate.getFullYear(),calDate.getMonth()+1,0).getDate();

for(let i=0;i<start;i++) grid.appendChild(document.createElement("div"));

for(let d=1;d<=days;d++){
let date=new Date(calDate.getFullYear(),calDate.getMonth(),d);
let iso=getISO(date);

let cell=document.createElement("div");
cell.innerText=d;

if(isVacation(date)) cell.style.background="#b6f2b6";
if(holidays[iso]) cell.style.background="#ffcccc";
if(localStorage.getItem("plan_"+iso)) cell.style.background="#a0d8ff";

cell.onclick=()=>{
let mondayClicked=getMonday(date);
let mondayToday=getMonday(new Date());
weekOffset=Math.round((mondayClicked-mondayToday)/(1000*60*60*24*7));
render();
toggleCalendar();
};

grid.appendChild(cell);
}
}

// ===== PLANER =====
function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-day+(day===0?-6:1);
return new Date(d.setDate(diff));
}

function formatDate(d){
return d.toLocaleDateString("de-DE");
}

function createDay(name,date){
let div=document.createElement("div");
div.className="day";

let holidays=getHolidays(date.getFullYear());
let iso=getISO(date);

let header=document.createElement("div");
header.innerText=name+" ("+formatDate(date)+")";

if(isVacation(date)){
div.classList.add("vacation");
header.innerText+=" – Ferien";
}

if(holidays[iso]){
div.classList.add("holiday");
header.innerText+=" – "+holidays[iso];
}

if(getISO(new Date())===iso){
div.classList.add("today");
}

let ta=document.createElement("textarea");
let key="plan_"+iso;
ta.value=localStorage.getItem(key)||"";
ta.oninput=()=>localStorage.setItem(key,ta.value);

div.appendChild(header);
div.appendChild(ta);
return div;
}

function render(){
let base=new Date();
base.setDate(base.getDate()+weekOffset*7);

let monday=getMonday(base);
let sunday=new Date(monday);
sunday.setDate(monday.getDate()+6);

document.getElementById("title").innerText=
formatDate(monday)+" – "+formatDate(sunday);

let left=document.getElementById("left");
let right=document.getElementById("right");

left.innerHTML="";
right.innerHTML="";

["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i);
left.appendChild(createDay(d,date));
});

["Donnerstag","Freitag","Samstag","Sonntag"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i+3);
right.appendChild(createDay(d,date));
});
}

function changeWeek(n){weekOffset+=n;render();}
function goToday(){weekOffset=0;render();}

// ===== BACKUP =====
function backup(){
let data=JSON.stringify(localStorage);
let blob=new Blob([data]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup.txt";
a.click();
}

function loadBackup(){
let input=document.createElement("input");
input.type="file";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=e=>{
let data=JSON.parse(e.target.result);
for(let key in data) localStorage.setItem(key,data[key]);
render();
};
reader.readAsText(e.target.files[0]);
};
input.click();
}

render();
</script>

</body>
</html>
