<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplaner Pro Ultra + Backup</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#eaeaea;}
.header {display:flex;justify-content:space-between;padding:10px;background:white;position:sticky;top:0;z-index:5;}
.book {display:flex;height:calc(100vh - 60px);}
.page {flex:1;padding:10px;background:white;display:flex;flex-direction:column;gap:10px;}
.spine {width:6px;background:#ccc;}
.day {flex:1;display:flex;flex-direction:column;}
textarea {flex:1;border:none;resize:none;font-size:16px;
background-image:linear-gradient(to bottom,transparent 95%,#ddd 95%);
background-size:100% 28px;}
.today {outline:3px solid red;}

#calendarOverlay {
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.3);
    display:none;justify-content:center;align-items:center;z-index:10;
}

#calendarBox {
    background:white;padding:10px;border-radius:10px;width:90%;max-width:400px;
    animation:fadeIn 0.2s ease;
}

@keyframes fadeIn {
    from {transform:scale(0.95); opacity:0;}
    to {transform:scale(1); opacity:1;}
}

#miniCal {display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12px;}
.dayCell {padding:6px;text-align:center;border-radius:4px;}
.hasData { background:#a0d8ff; }
.current { border:2px solid red; }

.notice {
    background:#ffeaa7;
    padding:5px;
    text-align:center;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
<button onclick="changeWeek(-1)">←</button>
<div id="title"></div>
<div>
<button onclick="goToday()">Heute</button>
<button onclick="toggleCalendar()">📅</button>
<button onclick="changeWeek(1)">→</button>
</div>
</div>

<div class="notice" id="notice"></div>

<div id="calendarOverlay" onclick="closeCalendar(event)">
<div id="calendarBox" onclick="event.stopPropagation()">
<div style="display:flex;justify-content:space-between;margin-bottom:5px;">
<button onclick="changeMonth(-1)">←</button>
<div id="monthTitle"></div>
<button onclick="changeMonth(1)">→</button>
</div>
<div id="miniCal"></div>
</div>
</div>

<div class="book">
<div class="page" id="left"></div>
<div class="spine"></div>
<div class="page" id="right"></div>
</div>

<div style="position:fixed;bottom:10px;left:10px;right:10px;">
<button onclick="downloadBackup()">Backup herunterladen</button>
<button onclick="loadBackup()">Backup laden</button>
</div>

<script>
let weekOffset = 0;
let calDate = new Date();

function toggleCalendar(){
    document.getElementById("calendarOverlay").style.display = "flex";
}

function closeCalendar(){
    document.getElementById("calendarOverlay").style.display = "none";
}

function getMonday(d){
    d = new Date(d);
    let day = d.getDay();
    let diff = d.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
}

function formatDate(d){
    return d.toLocaleDateString("de-DE");
}

function hasData(date){
    return localStorage.getItem("plan_" + formatDate(date));
}

function createDay(name, date){
    let div = document.createElement("div");
    div.className = "day";

    let header = document.createElement("div");
    header.innerText = name + " (" + formatDate(date) + ")";

    let ta = document.createElement("textarea");
    let key = "plan_" + formatDate(date);
    ta.value = localStorage.getItem(key) || "";

    ta.oninput = () => {
        localStorage.setItem(key, ta.value);
        localStorage.setItem("lastChange", Date.now());
        renderMiniCalendar();
        updateNotice();
    };

    if(formatDate(new Date()) === formatDate(date) && weekOffset === 0){
        div.classList.add("today");
    }

    div.appendChild(header);
    div.appendChild(ta);
    return div;
}

function render(){
    let base = new Date();
    base.setDate(base.getDate() + weekOffset * 7);

    let monday = getMonday(base);
    let sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    document.getElementById("title").innerText =
        formatDate(monday) + " – " + formatDate(sunday);

    let left = document.getElementById("left");
    let right = document.getElementById("right");

    left.innerHTML = "";
    right.innerHTML = "";

    ["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
        let date = new Date(monday);
        date.setDate(monday.getDate()+i);
        left.appendChild(createDay(d,date));
    });

    ["Donnerstag","Freitag"].forEach((d,i)=>{
        let date = new Date(monday);
        date.setDate(monday.getDate()+i+3);
        right.appendChild(createDay(d,date));
    });

    let weekend = document.createElement("div");
    weekend.style.display = "flex";
    weekend.style.flex = "1";

    let sat = new Date(monday);
    sat.setDate(monday.getDate()+5);

    let sun = new Date(monday);
    sun.setDate(monday.getDate()+6);

    weekend.appendChild(createDay("Samstag", sat));
    weekend.appendChild(createDay("Sonntag", sun));

    right.appendChild(weekend);

    renderMiniCalendar();
    updateNotice();
}

function changeWeek(n){ weekOffset += n; render(); }
function goToday(){ weekOffset = 0; calDate = new Date(); render(); }

function jumpToDate(date){
    let today = new Date();
    let diff = Math.floor((date - today)/(1000*60*60*24));
    weekOffset = Math.floor(diff/7);
    render();
    closeCalendar();
}

function changeMonth(n){
    calDate.setMonth(calDate.getMonth() + n);
    renderMiniCalendar();
}

function renderMiniCalendar(){
    let cal = document.getElementById("miniCal");
    cal.innerHTML = "";

    let year = calDate.getFullYear();
    let month = calDate.getMonth();

    document.getElementById("monthTitle").innerText =
        calDate.toLocaleDateString("de-DE", {month:"long", year:"numeric"});

    let first = new Date(year, month, 1);
    let startDay = first.getDay() || 7;
    let daysInMonth = new Date(year, month+1, 0).getDate();

    for(let i=1;i<startDay;i++){
        cal.appendChild(document.createElement("div"));
    }

    for(let d=1; d<=daysInMonth; d++){
        let date = new Date(year, month, d);
        let cell = document.createElement("div");
        cell.className = "dayCell";
        cell.innerText = d;

        if(hasData(date)) cell.classList.add("hasData");
        if(formatDate(date) === formatDate(new Date())) cell.classList.add("current");

        cell.onclick = () => jumpToDate(date);
        cal.appendChild(cell);
    }
}

function downloadBackup(){
    let data = JSON.stringify(localStorage);
    let blob = new Blob([data], {type:"text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "backup.txt";
    a.click();
    localStorage.setItem("lastBackup", Date.now());
    updateNotice();
}

function loadBackup(){
    let input = document.createElement("input");
    input.type = "file";
    input.onchange = e => {
        let file = e.target.files[0];
        let reader = new FileReader();
        reader.onload = e => {
            let data = JSON.parse(e.target.result);
            for(let key in data){
                localStorage.setItem(key, data[key]);
            }
            render();
        };
        reader.readAsText(file);
    };
    input.click();
}

function updateNotice(){
    let last = localStorage.getItem("lastBackup");
    if(!last){
        document.getElementById("notice").innerText = "Noch kein Backup erstellt.";
        return;
    }
    let days = Math.floor((Date.now()-last)/(1000*60*60*24));
    if(days >= 7){
        document.getElementById("notice").innerText =
            "Letztes Backup vor " + days + " Tagen – sichern!";
    } else {
        document.getElementById("notice").innerText = "";
    }
}

render();
</script>

</body>
</html>
