<!-- NUR DIE SCRIPT-SEKTION IST KORRIGIERT -->
<script>
let weekOffset = 0;
let calDate = new Date();

// ===== FEIERTAGE =====
function getEaster(year){
let f=Math.floor,G=year%19,C=f(year/100);
let H=(C-f(C/4)-f((8*C+13)/25)+19*G+15)%30;
let I=H-f(H/28)*(1-f(29/(H+1))*f((21-G)/11));
let J=(year+f(year/4)+I+2-C+f(C/4))%7;
let L=I-J;
let month=3+f((L+40)/44);
let day=L+28-31*f(month/4);
return new Date(year,month-1,day);
}

function getHolidays(year){
let easter=getEaster(year);
let h={};
const add=(d,n)=>h[d.toLocaleDateString("de-DE")]=n;

add(new Date(year,0,1),"Neujahr");
add(new Date(year,0,6),"Heilige Drei Könige");
add(new Date(year,4,1),"Tag der Arbeit");
add(new Date(year,9,3),"Tag der Deutschen Einheit");
add(new Date(year,10,1),"Allerheiligen");
add(new Date(year,11,25),"1. Weihnachtstag");
add(new Date(year,11,26),"2. Weihnachtstag");

let goodFriday=new Date(easter); goodFriday.setDate(easter.getDate()-2);
let easterMon=new Date(easter); easterMon.setDate(easter.getDate()+1);
let ascension=new Date(easter); ascension.setDate(easter.getDate()+39);
let pentecostMon=new Date(easter); pentecostMon.setDate(easter.getDate()+50);
let corpusChristi=new Date(easter); corpusChristi.setDate(easter.getDate()+60);

add(goodFriday,"Karfreitag");
add(easterMon,"Ostermontag");
add(ascension,"Christi Himmelfahrt");
add(pentecostMon,"Pfingstmontag");
add(corpusChristi,"Fronleichnam");

return h;
}

// ===== PLANER =====
function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-day+(day===0?-6:1);
return new Date(d.setDate(diff));
}

function formatDate(d){return d.toLocaleDateString("de-DE");}

function createDay(name,date){
let div=document.createElement("div");
div.className="day";

let dateStr=formatDate(date);
let holidays=getHolidays(date.getFullYear());

let header=document.createElement("div");
header.innerText=name+" ("+dateStr+")";

if(holidays[dateStr]){
header.innerText+=" – "+holidays[dateStr];
div.classList.add("holiday");
}

if(formatDate(new Date())===dateStr){
div.classList.add("today");
}

let ta=document.createElement("textarea");
let key="plan_"+dateStr;
ta.value=localStorage.getItem(key)||"";
ta.oninput=()=>localStorage.setItem(key,ta.value);

div.appendChild(header);
div.appendChild(ta);
return div;
}

function render(){
let base=new Date();
base.setDate(base.getDate()+weekOffset*7);

let monday=getMonday(base);
let sunday=new Date(monday);
sunday.setDate(monday.getDate()+6);

document.getElementById("title").innerText=
formatDate(monday)+" – "+formatDate(sunday);

let left=document.getElementById("left");
let right=document.getElementById("right");

left.innerHTML="";
right.innerHTML="";

["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i);
left.appendChild(createDay(d,date));
});

["Donnerstag","Freitag"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i+3);
right.appendChild(createDay(d,date));
});

let weekend=document.createElement("div");
weekend.style.display="flex";
weekend.style.flexDirection="column";
weekend.style.flex="1";

let sat=new Date(monday);
sat.setDate(monday.getDate()+5);

let sun=new Date(monday);
sun.setDate(monday.getDate()+6);

weekend.appendChild(createDay("Samstag",sat));
weekend.appendChild(createDay("Sonntag",sun));

right.appendChild(weekend);
}

function changeWeek(n){weekOffset+=n;render();}
function goToday(){weekOffset=0;render();}

// ===== KALENDER =====
function toggleCalendar(){
let el=document.getElementById("calendarOverlay");
if(el.style.display==="block"){
el.style.display="none";
}else{
el.style.display="block";
renderCalendar();
}
}

function changeMonth(n){
calDate = new Date(calDate.getFullYear(), calDate.getMonth()+n, 1);
renderCalendar();
}

function renderCalendar(){
let grid=document.getElementById("calendarGrid");
grid.innerHTML="";

let holidays=getHolidays(calDate.getFullYear());
let todayStr=formatDate(new Date());

let year=calDate.getFullYear();
let month=calDate.getMonth();

document.getElementById("monthTitle").innerText=
calDate.toLocaleDateString("de-DE",{month:"long",year:"numeric"});

let first=new Date(year,month,1);
let start=(first.getDay()===0 ? 6 : first.getDay()-1);
let days=new Date(year,month+1,0).getDate();

for(let i=0;i<start;i++){
grid.appendChild(document.createElement("div"));
}

for(let d=1;d<=days;d++){
let date=new Date(year,month,d);
let cell=document.createElement("div");
cell.innerText=d;
cell.style.textAlign="center";
cell.style.padding="6px";

let key=formatDate(date);

if(holidays[key]) cell.style.background="#ffcccc";
if(localStorage.getItem("plan_"+key)) cell.style.background="#a0d8ff";

if(key===todayStr){
cell.style.border="2px solid red";
cell.style.borderRadius="50%";
}

// 👉 FIX: richtige Woche berechnen
cell.onclick=()=>{
let clickedMonday = getMonday(date);
let todayMonday = getMonday(new Date());

let diffWeeks = Math.round((clickedMonday - todayMonday)/(1000*60*60*24*7));

weekOffset = diffWeeks;

render();
toggleCalendar();
};

grid.appendChild(cell);
}
}

// ===== SWIPE =====
let startX=0,currentX=0,isDragging=false;
const book=document.getElementById("book");

book.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
isDragging=true;
});

book.addEventListener("touchmove",e=>{
if(!isDragging)return;
currentX=e.touches[0].clientX;
let diff=currentX-startX;
book.style.transform="translateX("+diff+"px)";
});

book.addEventListener("touchend",()=>{
if(!isDragging)return;

let diff=currentX-startX;

if(diff<-80){
book.style.transform="translateX(-100%)";
setTimeout(()=>{changeWeek(1);book.style.transform="translateX(0)";},200);
}
else if(diff>80){
book.style.transform="translateX(100%)";
setTimeout(()=>{changeWeek(-1);book.style.transform="translateX(0)";},200);
}
else{
book.style.transform="translateX(0)";
}

isDragging=false;
});

// START
render();
</script>
