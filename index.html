<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplaner</title>

<style>
body {margin:0;font-family:-apple-system;background:#eaeaea;}
.header {display:flex;justify-content:space-between;padding:10px;background:white;}
.book {display:flex;height:calc(100vh - 120px);transition:transform .3s ease;}
.page {padding:8px;background:white;display:flex;flex-direction:column;gap:8px;}
.page#left {flex:1.2;}
.page#right {flex:0.8;}
.spine {width:4px;background:#ccc;}
.day {flex:1;display:flex;flex-direction:column;}
textarea {
flex:1;border:none;font-size:14px;
background-image:linear-gradient(to bottom,transparent 95%,#ddd 95%);
background-size:100% 24px;
}
.today {outline:2px solid red;}
.holiday {background:#ffe0e0;}
.vacation {background:#e6ffe6;}
.footer {position:fixed;bottom:0;width:100%;background:white;text-align:center;padding:6px;}
</style>
</head>

<body>

<!-- MINI KALENDER -->
<div id="calendarOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);display:none;z-index:9999;">
<div style="background:white;margin:60px auto;padding:10px;width:90%;max-width:350px;border-radius:10px;">
<div style="display:flex;justify-content:space-between;">
<button onclick="changeMonth(-1)">←</button>
<div id="monthTitle"></div>
<button onclick="changeMonth(1)">→</button>
</div>
<div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;"></div>
<button onclick="toggleCalendar()" style="margin-top:10px;width:100%;">Schließen</button>
</div>
</div>

<!-- HEADER -->
<div class="header">
<button onclick="changeWeek(-1)">←</button>
<div id="title"></div>
<button onclick="toggleCalendar()">📅</button>
<div>
<button onclick="goToday()">Heute</button>
<button onclick="changeWeek(1)">→</button>
</div>
</div>

<div class="book" id="book">
<div class="page" id="left"></div>
<div class="spine"></div>
<div class="page" id="right"></div>
</div>

<div class="footer">
<button onclick="backup()">💾 Backup</button>
<button onclick="loadBackup()">📂 Laden</button>
</div>

<script>
let weekOffset=0;
let calDate=new Date();
let startX=0,currentX=0,isDragging=false;

// ===== KEY =====
function getKey(d){return d.toISOString().split("T")[0];}

// ===== FEIERTAGE =====
function getEaster(y){
let f=Math.floor,G=y%19,C=f(y/100);
let H=(C-f(C/4)-f((8*C+13)/25)+19*G+15)%30;
let I=H-f(H/28)*(1-f(29/(H+1))*f((21-G)/11));
let J=(y+f(y/4)+I+2-C+f(C/4))%7;
let L=I-J;
let m=3+f((L+40)/44);
let d=L+28-31*f(m/4);
return new Date(y,m-1,d);
}

function getHolidays(y){
let e=getEaster(y);
let h={};
const add=(d,n)=>h[getKey(d)]=n;

add(new Date(y,0,1),"Neujahr");
add(new Date(y,0,6),"Heilige Drei Könige");
add(new Date(y,4,1),"Tag der Arbeit");
add(new Date(y,9,3),"Tag der Deutschen Einheit");
add(new Date(y,10,1),"Allerheiligen");
add(new Date(y,11,25),"1. Weihnachtstag");
add(new Date(y,11,26),"2. Weihnachtstag");

let gf=new Date(e);gf.setDate(e.getDate()-2);
let em=new Date(e);em.setDate(e.getDate()+1);
let ch=new Date(e);ch.setDate(e.getDate()+39);
let pm=new Date(e);pm.setDate(e.getDate()+50);
let fr=new Date(e);fr.setDate(e.getDate()+60);

add(gf,"Karfreitag");
add(em,"Ostermontag");
add(ch,"Christi Himmelfahrt");
add(pm,"Pfingstmontag");
add(fr,"Fronleichnam");

return h;
}

// ===== FERIEN =====
const vacations=[
["2026-02-16","2026-02-20"],
["2026-03-30","2026-04-11"],
["2026-05-26","2026-06-06"],
["2026-08-03","2026-09-14"],
["2026-11-02","2026-11-06"],
["2026-12-24","2027-01-09"]
].map(v=>({start:new Date(v[0]),end:new Date(v[1])}));

function isVacation(date){
return vacations.some(v=>date>=v.start&&date<=v.end);
}

// ===== PLANER =====
function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-day+(day===0?-6:1);
return new Date(d.setDate(diff));
}

function createDay(name,date){
let div=document.createElement("div");
let key=getKey(date);
let holidays=getHolidays(date.getFullYear());

let text=name+" ("+date.toLocaleDateString("de-DE")+")";

if(isVacation(date)){
div.classList.add("vacation");
text+=" – Ferien";
}

if(holidays[key]){
div.classList.add("holiday");
text+=" – "+holidays[key];
}

if(getKey(new Date())===key){
div.classList.add("today");
}

let header=document.createElement("div");
header.innerText=text;

let ta=document.createElement("textarea");
ta.value=localStorage.getItem("plan_"+key)||"";
ta.oninput=()=>localStorage.setItem("plan_"+key,ta.value);

div.appendChild(header);
div.appendChild(ta);
return div;
}

function render(){
let base=new Date();
base.setDate(base.getDate()+weekOffset*7);

let monday=getMonday(base);

let left=document.getElementById("left");
let right=document.getElementById("right");

left.innerHTML="";
right.innerHTML="";

["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
let date=new Date(monday);date.setDate(monday.getDate()+i);
left.appendChild(createDay(d,date));
});

["Donnerstag","Freitag"].forEach((d,i)=>{
let date=new Date(monday);date.setDate(monday.getDate()+i+3);
right.appendChild(createDay(d,date));
});
}

// ===== MINI KALENDER =====
function toggleCalendar(){
let el=document.getElementById("calendarOverlay");
el.style.display=(el.style.display==="block")?"none":"block";
if(el.style.display==="block") renderCalendar();
}

function changeMonth(n){
calDate.setMonth(calDate.getMonth()+n);
renderCalendar();
}

function renderCalendar(){
let grid=document.getElementById("calendarGrid");
grid.innerHTML="";

let holidays=getHolidays(calDate.getFullYear());

let first=new Date(calDate.getFullYear(),calDate.getMonth(),1);
let start=(first.getDay()+6)%7;
let days=new Date(calDate.getFullYear(),calDate.getMonth()+1,0).getDate();

for(let i=0;i<start;i++) grid.appendChild(document.createElement("div"));

for(let d=1;d<=days;d++){
let date=new Date(calDate.getFullYear(),calDate.getMonth(),d);
let key=getKey(date);

let cell=document.createElement("div");
cell.innerText=d;

// Reihenfolge
if(isVacation(date)) cell.style.background="#b6f2b6";
if(holidays[key]) cell.style.background="#ffcccc";
if(localStorage.getItem("plan_"+key)) cell.style.background="#a0d8ff";

cell.onclick=()=>{
let mondayClicked=getMonday(date);
let mondayToday=getMonday(new Date());
weekOffset=Math.round((mondayClicked-mondayToday)/(1000*60*60*24*7));
render();
toggleCalendar();
};

grid.appendChild(cell);
}
}

// ===== NAV =====
function changeWeek(n){weekOffset+=n;render();}
function goToday(){weekOffset=0;render();}

// ===== SWIPE =====
const book=document.getElementById("book");

book.addEventListener("touchstart",e=>{
if(e.target.closest("textarea")) return;
startX=e.touches[0].clientX;
isDragging=true;
});

book.addEventListener("touchmove",e=>{
if(!isDragging) return;
currentX=e.touches[0].clientX;
book.style.transform="translateX("+(currentX-startX)+"px)";
});

book.addEventListener("touchend",()=>{
if(!isDragging) return;

let diff=currentX-startX;

if(diff<-80){
book.style.transform="translateX(-100%)";
setTimeout(()=>{changeWeek(1);book.style.transform="translateX(0)";},200);
}
else if(diff>80){
book.style.transform="translateX(100%)";
setTimeout(()=>{changeWeek(-1);book.style.transform="translateX(0)";},200);
}
else{
book.style.transform="translateX(0)";
}

isDragging=false;
});

// ===== BACKUP =====
function backup(){
let data=JSON.stringify(localStorage);
let blob=new Blob([data]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup.txt";
a.click();
}

function loadBackup(){
let input=document.createElement("input");
input.type="file";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=e=>{
let data=JSON.parse(e.target.result);
for(let key in data) localStorage.setItem(key,data[key]);
render();
};
reader.readAsText(e.target.files[0]);
};
input.click();
}

// START
render();
</script>

</body>
</html>
