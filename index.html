<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplaner</title>
<link rel="apple-touch-icon" href="./icon.png">

<style>
body {margin:0;font-family:-apple-system;background:#eaeaea;overflow:hidden;}
.header {display:flex;justify-content:space-between;padding:10px;background:white;align-items:center;}

.book {display:flex;height:calc(100vh - 80px);position:relative;}

.pageWrapper {
display:flex;width:100%;height:100%;
transition:transform 0.3s ease;
}

.page {padding:8px;background:white;display:flex;flex-direction:column;gap:8px;}
.page#left {flex:1.2;}
.page#right {flex:0.8;}

.spine {width:4px;background:#ccc;}

.day {flex:1;display:flex;flex-direction:column;}

textarea {
flex:1;border:none;font-size:14px;
background-image:linear-gradient(to bottom,transparent 95%,#ddd 95%);
background-size:100% 24px;
}

.today {outline:2px solid red;}
.holiday {background:#ffe0e0;}
.vacation {background:#e6ffe6;}

.shadow {
position:absolute;top:0;left:0;width:100%;height:100%;
background:linear-gradient(to right,rgba(0,0,0,0.2),transparent);
opacity:0;pointer-events:none;
}

button {font-size:16px;padding:6px 10px;}
</style>
</head>

<body>

<div id="calendarOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;z-index:1000;">
<div style="background:white;margin:50px auto;padding:10px;width:90%;max-width:350px;border-radius:10px;">
<div style="display:flex;justify-content:space-between;">
<button onclick="changeMonth(-1)">←</button>
<div id="monthTitle"></div>
<button onclick="changeMonth(1)">→</button>
</div>
<div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;"></div>
<button onclick="toggleCalendar()" style="margin-top:10px;width:100%;">Schließen</button>
</div>
</div>

<div class="header">
<button onclick="changeWeek(-1)">←</button>
<div id="title"></div>
<button onclick="toggleCalendar()">📅</button>
<div>
<button onclick="goToday()">Heute</button>
<button onclick="changeWeek(1)">→</button>
</div>
</div>

<div class="book">
<div class="pageWrapper" id="pageWrapper">
<div class="page" id="left"></div>
<div class="spine"></div>
<div class="page" id="right"></div>
</div>
<div class="shadow" id="shadow"></div>
</div>

<div style="position:fixed;bottom:10px;width:100%;text-align:center;">
<button onclick="backup()">⚡ Backup</button>
<button onclick="loadBackup()">Laden</button>
</div>

<script>
let weekOffset=0;
let calDate=new Date();

function normalize(d){
return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function formatDate(d){return d.toLocaleDateString("de-DE");}

// ===== FEIERTAGE =====
function getEaster(year){
let f=Math.floor, G=year%19, C=f(year/100), H=(C-f(C/4)-f((8*C+13)/25)+19*G+15)%30;
let I=H-f(H/28)*(1-f(29/(H+1))*f((21-G)/11));
let J=(year+f(year/4)+I+2-C+f(C/4))%7;
let L=I-J;
let month=3+f((L+40)/44);
let day=L+28-31*f(month/4);
return new Date(year,month-1,day);
}

function getHolidays(year){
let easter=getEaster(year);
let holidays={};

function add(date,name){
holidays[date.toLocaleDateString("de-DE")] = name;
}

add(new Date(year,0,1),"Neujahr");
add(new Date(year,0,6),"Heilige Drei Könige");
add(new Date(year,4,1),"Tag der Arbeit");
add(new Date(year,9,3),"Tag der Deutschen Einheit");
add(new Date(year,10,1),"Allerheiligen");
add(new Date(year,11,25),"1. Weihnachtstag");
add(new Date(year,11,26),"2. Weihnachtstag");

let goodFriday=new Date(easter); goodFriday.setDate(easter.getDate()-2);
let easterMon=new Date(easter); easterMon.setDate(easter.getDate()+1);
let ascension=new Date(easter); ascension.setDate(easter.getDate()+39);
let pentecostMon=new Date(easter); pentecostMon.setDate(easter.getDate()+50);
let corpusChristi=new Date(easter); corpusChristi.setDate(easter.getDate()+60);

add(goodFriday,"Karfreitag");
add(easterMon,"Ostermontag");
add(ascension,"Christi Himmelfahrt");
add(pentecostMon,"Pfingstmontag");
add(corpusChristi,"Fronleichnam");

return holidays;
}

// ===== FERIEN =====
function getVacations(year){
const ferien = {
2026: [
["2026-02-16","2026-02-20"],
["2026-03-30","2026-04-10"],
["2026-05-26","2026-06-05"],
["2026-08-03","2026-09-14"],
["2026-11-02","2026-11-06"],
["2026-12-24","2027-01-08"]
]
};

if(!ferien[year]) return [];

return ferien[year].map(f => ({
start: normalize(new Date(f[0])),
end: normalize(new Date(f[1]))
}));
}

// ===== PLANER =====
function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-day+(day===0?-6:1);
return new Date(d.setDate(diff));
}

function createDay(name,date){

date = normalize(date);

let div=document.createElement("div");
div.className="day";

let holidays=getHolidays(date.getFullYear());
let vacations=getVacations(date.getFullYear());

let isVacation = vacations.some(v => date >= v.start && date <= v.end);

let today = new Date();

if(
date.getFullYear() === today.getFullYear() &&
date.getMonth() === today.getMonth() &&
date.getDate() === today.getDate()
){
div.classList.add("today");
}

let header=document.createElement("div");
let dateStr=formatDate(date);

header.innerText=name+" ("+dateStr+")";

/* ⭐ EINZIGE ÄNDERUNG */
if(isVacation && holidays[dateStr]){
header.innerText+=" – Ferien – "+holidays[dateStr];
div.style.background="linear-gradient(135deg,#e6ffe6 50%,#ffe0e0 50%)";
}
else if(isVacation){
header.innerText+=" – Ferien";
div.classList.add("vacation");
}
else if(holidays[dateStr]){
header.innerText+=" – "+holidays[dateStr];
div.classList.add("holiday");
}

let ta=document.createElement("textarea");
let key="plan_"+dateStr;
ta.value=localStorage.getItem(key)||"";
ta.oninput=()=>localStorage.setItem(key,ta.value);

div.appendChild(header);
div.appendChild(ta);
return div;
}

function render(){
let base=new Date();
base.setDate(base.getDate()+weekOffset*7);

let monday=getMonday(base);
let sunday=new Date(monday);
sunday.setDate(monday.getDate()+6);

document.getElementById("title").innerText=
formatDate(monday)+" – "+formatDate(sunday);

let left=document.getElementById("left");
let right=document.getElementById("right");

left.innerHTML="";
right.innerHTML="";

["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i);
left.appendChild(createDay(d,date));
});

["Donnerstag","Freitag"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i+3);
right.appendChild(createDay(d,date));
});

let weekend=document.createElement("div");
weekend.style.display="flex";
weekend.style.flexDirection="column";
weekend.style.flex="1";

let sat=new Date(monday);
sat.setDate(monday.getDate()+5);

let sun=new Date(monday);
sun.setDate(monday.getDate()+6);

weekend.appendChild(createDay("Samstag",sat));
weekend.appendChild(createDay("Sonntag",sun));

right.appendChild(weekend);
}

// ===== NAVIGATION =====
function changeWeek(n){weekOffset+=n;render();}
function goToday(){weekOffset=0;render();}

render();
</script>

</body>
</html>
