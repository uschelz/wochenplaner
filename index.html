<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplaner</title>
<link rel="apple-touch-icon" href="./icon.png">

<style>
body {
margin:0;
font-family:-apple-system;
background:#eaeaea;
overflow:hidden;
}

/* HEADER */
.header {
display:flex;
justify-content:space-between;
padding:10px;
background:white;
align-items:center;
}

/* BUCH */
.book {
position:relative;
height:calc(100vh - 80px);
perspective:2500px;
overflow:hidden;
}

/* SEITEN */
.spread {
display:flex;
height:100%;
}

.page {
flex:1;
padding:8px;
background:white;
display:flex;
flex-direction:column;
gap:8px;
}

.left {flex:1.2;}
.right {flex:0.8;}

.spine {
width:4px;
background:#ccc;
}

/* TEXT */
textarea {
flex:1;
border:none;
font-size:14px;
background-image:linear-gradient(to bottom,transparent 95%,#ddd 95%);
background-size:100% 24px;
}

/* FLIP SEITE */
.flip {
position:absolute;
top:0;
left:50%;
width:50%;
height:100%;
transform-origin:left;
transform-style:preserve-3d;
display:none;
}

/* VORDERSEITE */
.flipFront,
.flipBack {
position:absolute;
width:100%;
height:100%;
background:white;
backface-visibility:hidden;
}

/* RÜCKSEITE */
.flipBack {
transform:rotateY(180deg);
}

/* SCHATTEN */
.shadow {
position:absolute;
top:0;
left:50%;
width:50%;
height:100%;
background:linear-gradient(to left, rgba(0,0,0,0.3), transparent);
opacity:0;
pointer-events:none;
}

/* BUTTON */
button {font-size:16px;padding:6px 10px;}
</style>
</head>

<body>

<div class="header">
<button onclick="changeWeek(-1)">←</button>
<div id="title"></div>
<button onclick="toggleCalendar()">📅</button>
<div>
<button onclick="goToday()">Heute</button>
<button onclick="changeWeek(1)">→</button>
</div>
</div>

<div class="book" id="book">

<div class="spread" id="spread">
<div class="page left" id="left"></div>
<div class="spine"></div>
<div class="page right" id="right"></div>
</div>

<div class="flip" id="flip">
<div class="flipFront" id="flipFront"></div>
<div class="flipBack" id="flipBack"></div>
</div>

<div class="shadow" id="shadow"></div>

</div>

<div style="position:fixed;bottom:10px;width:100%;text-align:center;">
<button onclick="backup()">⚡ Backup</button>
<button onclick="loadBackup()">Laden</button>
</div>

<script>
let weekOffset = 0;

/* ===== DATUM ===== */
function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-day+(day===0?-6:1);
return new Date(d.setDate(diff));
}

function formatDate(d){return d.toLocaleDateString("de-DE");}

/* ===== SEITEN ===== */
function createDay(name,date){
let div=document.createElement("div");

let h=document.createElement("div");
h.innerText=name+" ("+formatDate(date)+")";

let ta=document.createElement("textarea");
let key="plan_"+formatDate(date);
ta.value=localStorage.getItem(key)||"";
ta.oninput=()=>localStorage.setItem(key,ta.value);

div.appendChild(h);
div.appendChild(ta);
return div;
}

function render(offset){
let base=new Date();
base.setDate(base.getDate()+offset*7);

let monday=getMonday(base);
let sunday=new Date(monday);
sunday.setDate(monday.getDate()+6);

document.getElementById("title").innerText=
formatDate(monday)+" – "+formatDate(sunday);

let left=document.getElementById("left");
let right=document.getElementById("right");

left.innerHTML="";
right.innerHTML="";

["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i);
left.appendChild(createDay(d,date));
});

["Donnerstag","Freitag"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i+3);
right.appendChild(createDay(d,date));
});
}

/* ===== BLÄTTERN ===== */
let startX=0;
let dragging=false;

const flip=document.getElementById("flip");
const shadow=document.getElementById("shadow");

document.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
dragging=true;

flip.style.display="block";
flipFront.innerHTML=document.getElementById("right").innerHTML;
flipBack.innerHTML=document.getElementById("left").innerHTML;
});

document.addEventListener("touchmove",e=>{
if(!dragging)return;

let x=e.touches[0].clientX;
let diff=startX-x;

let progress=Math.min(Math.max(diff/300,0),1);

let angle=-180*progress;
flip.style.transform="rotateY("+angle+"deg)";

shadow.style.opacity=progress;
});

document.addEventListener("touchend",e=>{
if(!dragging)return;

let x=e.changedTouches[0].clientX;
let diff=startX-x;

if(diff>80){
flip.style.transform="rotateY(-180deg)";
setTimeout(()=>{
weekOffset++;
render(weekOffset);
flip.style.display="none";
flip.style.transform="rotateY(0deg)";
},300);
}else{
flip.style.transform="rotateY(0deg)";
setTimeout(()=>flip.style.display="none",200);
}

shadow.style.opacity=0;
dragging=false;
});

/* ===== NAV ===== */
function changeWeek(n){weekOffset+=n;render(weekOffset);}
function goToday(){weekOffset=0;render(weekOffset);}

/* ===== BACKUP ===== */
function backup(){
let data=JSON.stringify(localStorage);
let blob=new Blob([data]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup.txt";
a.click();
}

function loadBackup(){
let input=document.createElement("input");
input.type="file";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=e=>{
let data=JSON.parse(e.target.result);
for(let k in data) localStorage.setItem(k,data[k]);
render(weekOffset);
};
reader.readAsText(e.target.files[0]);
};
input.click();
}

/* START */
render(weekOffset);
</script>

</body>
</html>
