<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplaner</title>
<link rel="apple-touch-icon" href="./icon.png">

<style>
body {margin:0;font-family:-apple-system;background:#eaeaea;overflow:hidden;}

.header {display:flex;justify-content:space-between;padding:10px;background:white;align-items:center;}

.book {
display:flex;
height:calc(100vh - 80px);
transition: transform 0.3s ease;
}

.page {padding:8px;background:white;display:flex;flex-direction:column;gap:8px;}
.page#left {flex:1.2;}
.page#right {flex:0.8;}

.spine {width:4px;background:#ccc;}

.day {flex:1;display:flex;flex-direction:column;}

textarea {
flex:1;border:none;font-size:14px;
background-image:linear-gradient(to bottom,transparent 95%,#ddd 95%);
background-size:100% 24px;
}

.today {outline:2px solid red;}

button {font-size:16px;padding:6px 10px;}
</style>
</head>

<body>

<!-- OVERLAY KALENDER -->
<div id="calendarOverlay" style="
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;z-index:1000;">
<div style="
background:white;margin:50px auto;padding:10px;
width:90%;max-width:350px;border-radius:10px;">

<div style="display:flex;justify-content:space-between;">
<button onclick="changeMonth(-1)">←</button>
<div id="monthTitle"></div>
<button onclick="changeMonth(1)">→</button>
</div>

<div id="calendarGrid" style="
display:grid;grid-template-columns:repeat(7,1fr);
gap:4px;margin-top:10px;"></div>

<button onclick="toggleCalendar()" style="margin-top:10px;width:100%;">Schließen</button>
</div>
</div>

<!-- HEADER -->
<div class="header">
<button onclick="changeWeek(-1)">←</button>
<div id="title"></div>
<button onclick="toggleCalendar()">📅</button>
<div>
<button onclick="goToday()">Heute</button>
<button onclick="changeWeek(1)">→</button>
</div>
</div>

<!-- PLANER -->
<div class="book">
<div class="page" id="left"></div>
<div class="spine"></div>
<div class="page" id="right"></div>
</div>

<!-- BACKUP -->
<div style="position:fixed;bottom:10px;width:100%;text-align:center;">
<button onclick="backup()">⚡ Backup</button>
<button onclick="loadBackup()">Laden</button>
</div>

<script>
let weekOffset = 0;
let calDate = new Date();

// ===== PLANER =====
function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-day+(day===0?-6:1);
return new Date(d.setDate(diff));
}

function formatDate(d){return d.toLocaleDateString("de-DE");}

function createDay(name,date){
let div=document.createElement("div");
div.className="day";

let header=document.createElement("div");
header.innerText=name+" ("+formatDate(date)+")";

let ta=document.createElement("textarea");
let key="plan_"+formatDate(date);
ta.value=localStorage.getItem(key)||"";

ta.oninput=()=>localStorage.setItem(key,ta.value);

if(formatDate(new Date())===formatDate(date)&&weekOffset===0){
div.classList.add("today");
}

div.appendChild(header);
div.appendChild(ta);
return div;
}

function render(){
let base=new Date();
base.setDate(base.getDate()+weekOffset*7);

let monday=getMonday(base);
let sunday=new Date(monday);
sunday.setDate(monday.getDate()+6);

document.getElementById("title").innerText=
formatDate(monday)+" – "+formatDate(sunday);

let left=document.getElementById("left");
let right=document.getElementById("right");

left.innerHTML="";
right.innerHTML="";

["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i);
left.appendChild(createDay(d,date));
});

["Donnerstag","Freitag"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i+3);
right.appendChild(createDay(d,date));
});

let weekend=document.createElement("div");
weekend.style.display="flex";
weekend.style.flexDirection="column";
weekend.style.flex="1";

let sat=new Date(monday);
sat.setDate(monday.getDate()+5);

let sun=new Date(monday);
sun.setDate(monday.getDate()+6);

let satDiv=createDay("Samstag",sat);
let sunDiv=createDay("Sonntag",sun);

satDiv.style.flex="1";
sunDiv.style.flex="1";

weekend.appendChild(satDiv);
weekend.appendChild(sunDiv);

right.appendChild(weekend);
}

function changeWeek(n){weekOffset+=n;render();}
function goToday(){weekOffset=0;render();}

// ===== BACKUP =====
function backup(){
let data=JSON.stringify(localStorage);
let blob=new Blob([data],{type:"text/plain"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup.txt";
a.click();
}

function loadBackup(){
let input=document.createElement("input");
input.type="file";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=e=>{
let data=JSON.parse(e.target.result);
for(let key in data){localStorage.setItem(key,data[key]);}
render();
};
reader.readAsText(e.target.files[0]);
};
input.click();
}

// ===== KALENDER =====
function toggleCalendar(){
let el=document.getElementById("calendarOverlay");
el.style.display = (el.style.display==="block") ? "none" : "block";
renderCalendar();
}

function changeMonth(n){
calDate.setMonth(calDate.getMonth()+n);
renderCalendar();
}

function renderCalendar(){
let grid=document.getElementById("calendarGrid");
grid.innerHTML="";

let year=calDate.getFullYear();
let month=calDate.getMonth();

document.getElementById("monthTitle").innerText=
calDate.toLocaleDateString("de-DE",{month:"long",year:"numeric"});

let first=new Date(year,month,1);
let start=first.getDay()||7;
let days=new Date(year,month+1,0).getDate();

for(let i=1;i<start;i++){
grid.appendChild(document.createElement("div"));
}

for(let d=1;d<=days;d++){
let date=new Date(year,month,d);
let cell=document.createElement("div");
cell.innerText=d;
cell.style.textAlign="center";
cell.style.padding="6px";

let key="plan_"+date.toLocaleDateString("de-DE");

if(localStorage.getItem(key)){
cell.style.background="#a0d8ff";
}

cell.onclick=()=>{
let today=new Date();
let diff=Math.floor((date-today)/(1000*60*60*24));
weekOffset=Math.floor(diff/7);
render();
toggleCalendar();
};

grid.appendChild(cell);
}
}

// ===== SWIPE / BLÄTTERN =====
let startX=0,currentX=0,isDragging=false;
const book=document.querySelector(".book");

document.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
isDragging=true;
});

document.addEventListener("touchmove",e=>{
if(!isDragging)return;
currentX=e.touches[0].clientX;
let diff=currentX-startX;
book.style.transform="translateX("+diff+"px)";
});

document.addEventListener("touchend",()=>{
if(!isDragging)return;

let diff=currentX-startX;

if(diff<-80){
book.style.transform="translateX(-100%)";
setTimeout(()=>{changeWeek(1);book.style.transform="translateX(0)";},200);
}
else if(diff>80){
book.style.transform="translateX(100%)";
setTimeout(()=>{changeWeek(-1);book.style.transform="translateX(0)";},200);
}
else{
book.style.transform="translateX(0)";
}

isDragging=false;
});

render();
</script>

</body>
</html>
