<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wochenplaner</title>

<style>
body {margin:0;font-family:-apple-system;background:#eaeaea;overflow:hidden;}
.header {display:flex;justify-content:space-between;padding:10px;background:white;align-items:center;}
.book {display:flex;height:calc(100vh - 80px);position:relative;}
.pageWrapper {display:flex;width:100%;height:100%;transition:transform 0.3s ease;}
.page {padding:8px;background:white;display:flex;flex-direction:column;gap:8px;}
.page#left {flex:1.2;}
.page#right {flex:0.8;}
.spine {width:4px;background:#ccc;}
.day {flex:1;display:flex;flex-direction:column;}

textarea {
flex:1;border:none;font-size:14px;
background-image:linear-gradient(to bottom,transparent 95%,#ddd 95%);
background-size:100% 24px;
}

.today {outline:2px solid red;}
.holiday {background:#ffe0e0;}
.vacation {background:#e6ffe6;}

.shadow {
position:absolute;top:0;left:0;width:100%;height:100%;
background:linear-gradient(to right,rgba(0,0,0,0.2),transparent);
opacity:0;pointer-events:none;
}

button {font-size:16px;padding:6px 10px;}
</style>
</head>

<body>

<div id="calendarOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;z-index:1000;">
<div style="background:white;margin:50px auto;padding:10px;width:90%;max-width:350px;border-radius:10px;">
<div style="display:flex;justify-content:space-between;">
<button onclick="changeMonth(-1)">←</button>
<div id="monthTitle"></div>
<button onclick="changeMonth(1)">→</button>
</div>
<div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;"></div>
<button onclick="toggleCalendar()" style="margin-top:10px;width:100%;">Schließen</button>
</div>
</div>

<div class="header">
<button onclick="changeWeek(-1)">←</button>
<div id="title"></div>
<button onclick="toggleCalendar()">📅</button>
<div>
<button onclick="goToday()">Heute</button>
<button onclick="changeWeek(1)">→</button>
</div>
</div>

<div class="book">
<div class="pageWrapper" id="pageWrapper">
<div class="page" id="left"></div>
<div class="spine"></div>
<div class="page" id="right"></div>
</div>
<div class="shadow" id="shadow"></div>
</div>

<div style="position:fixed;bottom:10px;width:100%;text-align:center;">
<button onclick="backup()">⚡ Backup</button>
<button onclick="loadBackup()">Laden</button>
</div>

<script>
let weekOffset=0;
let calDate=new Date();

function normalize(d){return new Date(d.getFullYear(), d.getMonth(), d.getDate());}
function formatDate(d){return d.toLocaleDateString("de-DE");}

function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-day+(day===0?-6:1);
return new Date(d.setDate(diff));
}

// ===== FEIERTAGE =====
function getEaster(year){
let f=Math.floor,G=year%19,C=f(year/100);
let H=(C-f(C/4)-f((8*C+13)/25)+19*G+15)%30;
let I=H-f(H/28)*(1-f(29/(H+1))*f((21-G)/11));
let J=(year+f(year/4)+I+2-C+f(C/4))%7;
let L=I-J;
let month=3+f((L+40)/44);
let day=L+28-31*f(month/4);
return new Date(year,month-1,day);
}

function getHolidays(year){
let easter=getEaster(year);
let h={};
const add=(d,n)=>h[d.toLocaleDateString("de-DE")]=n;

add(new Date(year,0,1),"Neujahr");
add(new Date(year,0,6),"Heilige Drei Könige");
add(new Date(year,4,1),"Tag der Arbeit");
add(new Date(year,9,3),"Tag der Deutschen Einheit");
add(new Date(year,10,1),"Allerheiligen");
add(new Date(year,11,25),"1. Weihnachtstag");
add(new Date(year,11,26),"2. Weihnachtstag");

let gf=new Date(easter); gf.setDate(easter.getDate()-2);
let em=new Date(easter); em.setDate(easter.getDate()+1);
let asc=new Date(easter); asc.setDate(easter.getDate()+39);
let pm=new Date(easter); pm.setDate(easter.getDate()+50);
let cc=new Date(easter); cc.setDate(easter.getDate()+60);

add(gf,"Karfreitag");
add(em,"Ostermontag");
add(asc,"Christi Himmelfahrt");
add(pm,"Pfingstmontag");
add(cc,"Fronleichnam");

return h;
}

// ===== FERIEN =====
function getVacations(year){
const ferien={
2026:[["2026-02-16","2026-02-20"],["2026-03-30","2026-04-10"],["2026-05-26","2026-06-05"],["2026-08-03","2026-09-14"],["2026-11-02","2026-11-06"],["2026-12-24","2027-01-08"]]
};
if(!ferien[year]) return [];
return ferien[year].map(r=>({
start:normalize(new Date(r[0])),
end:normalize(new Date(r[1]))
}));
}

// ===== PLANER =====
function createDay(name,date){
date=normalize(date);

let div=document.createElement("div");
div.className="day";

let holidays=getHolidays(date.getFullYear());
let dateStr=formatDate(date);

let vacations=[...getVacations(date.getFullYear()),...getVacations(date.getFullYear()-1)];
let isVacation=vacations.some(v=>date>=v.start && date<=v.end);

if(formatDate(new Date())===dateStr){
div.classList.add("today");
}

let header=document.createElement("div");
header.innerText=name+" ("+dateStr+")";

/* ⭐ NEU */
if(isVacation && holidays[dateStr]){
header.innerText+=" – Ferien – "+holidays[dateStr];
div.style.background="linear-gradient(135deg,#e6ffe6 50%,#ffe0e0 50%)";
}
else if(isVacation){
header.innerText+=" – Ferien";
div.classList.add("vacation");
}
else if(holidays[dateStr]){
header.innerText+=" – "+holidays[dateStr];
div.classList.add("holiday");
}

let ta=document.createElement("textarea");
let key="plan_"+dateStr;
ta.value=localStorage.getItem(key)||"";
ta.oninput=()=>localStorage.setItem(key,ta.value);

div.appendChild(header);
div.appendChild(ta);
return div;
}

function render(){
let base=new Date();
base.setDate(base.getDate()+weekOffset*7);

let monday=getMonday(base);

let left=document.getElementById("left");
let right=document.getElementById("right");

left.innerHTML="";
right.innerHTML="";

["Montag","Dienstag","Mittwoch"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i);
left.appendChild(createDay(d,date));
});

["Donnerstag","Freitag"].forEach((d,i)=>{
let date=new Date(monday);
date.setDate(monday.getDate()+i+3);
right.appendChild(createDay(d,date));
});

let weekend=document.createElement("div");
weekend.style.display="flex";
weekend.style.flexDirection="column";
weekend.style.flex="1";

let sat=new Date(monday); sat.setDate(monday.getDate()+5);
let sun=new Date(monday); sun.setDate(monday.getDate()+6);

weekend.appendChild(createDay("Samstag",sat));
weekend.appendChild(createDay("Sonntag",sun));

right.appendChild(weekend);
}

// ===== MINIKALENDER =====
function toggleCalendar(){
let el=document.getElementById("calendarOverlay");

if(el.style.display==="block"){
el.style.display="none";
}else{
el.style.display="block";
calDate=new Date();
renderCalendar();
}
}

function changeMonth(n){
calDate.setMonth(calDate.getMonth()+n);
renderCalendar();
}

function renderCalendar(){
let grid=document.getElementById("calendarGrid");
grid.innerHTML="";

let holidays=getHolidays(calDate.getFullYear());
let vacations=[...getVacations(calDate.getFullYear()),...getVacations(calDate.getFullYear()-1)];

let year=calDate.getFullYear();
let month=calDate.getMonth();

document.getElementById("monthTitle").innerText=
calDate.toLocaleDateString("de-DE",{month:"long",year:"numeric"});

let first=new Date(year,month,1);
let start=first.getDay()||7;
let days=new Date(year,month+1,0).getDate();

for(let i=1;i<start;i++) grid.appendChild(document.createElement("div"));

for(let d=1;d<=days;d++){
let date=normalize(new Date(year,month,d));

let cell=document.createElement("div");
cell.innerText=d;
cell.style.textAlign="center";
cell.style.padding="6px";

let key=formatDate(date);
let isVacation=vacations.some(v=>date>=v.start && date<=v.end);
let isHoliday=holidays[key];
let hasEntry=localStorage.getItem("plan_"+key);

/* ⭐ NEU */
if(isVacation && isHoliday && hasEntry){
cell.style.background="linear-gradient(135deg,#b6f2b6 33%,#ffcccc 33%,#ffcccc 66%,#a0d8ff 66%)";
}
else if(isVacation && hasEntry){
cell.style.background="linear-gradient(135deg,#b6f2b6 50%,#a0d8ff 50%)";
}
else if(isHoliday && hasEntry){
cell.style.background="linear-gradient(135deg,#ffcccc 50%,#a0d8ff 50%)";
}
else if(isVacation){
cell.style.background="#b6f2b6";
}
else if(isHoliday){
cell.style.background="#ffcccc";
}
else if(hasEntry){
cell.style.background="#a0d8ff";
}

cell.onclick=()=>{
let today=new Date();
let diff=Math.floor((date-today)/(1000*60*60*24));
weekOffset=Math.floor(diff/7);
render();
toggleCalendar();
};

grid.appendChild(cell);
}
}

// ===== BACKUP =====
function backup(){
let data = JSON.stringify(localStorage);
let blob = new Blob([data], {type:"text/plain"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "backup.txt";
a.click();
}

function loadBackup(){
let input = document.createElement("input");
input.type = "file";
input.onchange = e => {
let reader = new FileReader();
reader.onload = e => {
let data = JSON.parse(e.target.result);
for(let key in data){localStorage.setItem(key,data[key]);}
render();
};
reader.readAsText(e.target.files[0]);
};
input.click();
}

// ===== SWIPE =====
let startX=0,currentX=0,isDragging=false;
const wrapper=document.getElementById("pageWrapper");
const shadow=document.getElementById("shadow");

document.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
currentX=startX;
isDragging=true;
wrapper.style.transition="none";
});

document.addEventListener("touchmove",e=>{
if(!isDragging)return;
currentX=e.touches[0].clientX;
let diff=currentX-startX;
wrapper.style.transform="translateX("+diff+"px)";
shadow.style.opacity=Math.min(Math.abs(diff)/150,0.4);
});

document.addEventListener("touchend",()=>{
if(!isDragging)return;
let diff=currentX-startX;
wrapper.style.transition="transform 0.3s ease";

if(diff<-80){
wrapper.style.transform="translateX(-100%)";
setTimeout(()=>{changeWeek(1);wrapper.style.transform="translateX(0)";},200);
}
else if(diff>80){
wrapper.style.transform="translateX(100%)";
setTimeout(()=>{changeWeek(-1);wrapper.style.transform="translateX(0)";},200);
}
else{
wrapper.style.transform="translateX(0)";
}

shadow.style.opacity=0;
isDragging=false;
});

function changeWeek(n){weekOffset+=n;render();}
function goToday(){weekOffset=0;render();}

render();
</script>

</body>
</html>
